[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electro-gui"
dynamic = ["version"]
description = "Interactive raster / PSTH and population explorer for exported oculomotor session.h5 files"
requires-python = ">=3.11"
# electro_gui reads sessions and fits population bases through `session_viewer`,
# a package of the phys-analysis repository that is not on PyPI.  Make it
# importable first: `pip install -e <phys-analysis>` or put the phys-analysis
# checkout on PYTHONPATH.
dependencies = [
  "numpy>=2.1,<3",
  "h5py>=3.10",
  "pandas>=2.1",
  "pyarrow>=14",
  "scikit-learn>=1.4",
  "matplotlib>=3.9,<4",
]

[project.scripts]
electro-gui = "electro_gui.cli:main"

[tool.setuptools.dynamic]
version = {attr = "electro_gui.__version__"}

[tool.setuptools.packages.find]
include = ["electro_gui*"]

[tool.setuptools.package-data]
"electro_gui" = [
  "README.md", "DESIGN.md",
  "static/*.html", "static/*.css", "static/*.js", "static/*.webmanifest",
  "static/findings/*", "static/icons/*",
]
